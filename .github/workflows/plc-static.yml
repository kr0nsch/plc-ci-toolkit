# Переиспользуемый workflow plc-ci-toolkit: проверки ПЛК-репозитория без CODESYS на GitHub-hosted
# раннере Linux. Репозиторий — на шаблоне plc-repo-template (инструменты в tools/, раскладка ST в
# src/ и tests/). Подключение — docs/USAGE.md, политика запуска — docs/runner_security.md.
#
#   jobs:
#     static:
#       uses: kr0nsch/plc-ci-toolkit/.github/workflows/plc-static.yml@v1
#
# Шаги: ruff, ruff format --check, mypy, pytest -> assemble -> st_lint --strict -> iec_checker
# (бинарник v0.4, закреплённый по размеру и SHA-256, или образ nightly по дайджесту) -> RuSTy
# plc --check (необязательно). Проверки выполняются все, даже если одна упала: сводка
# ($GITHUB_STEP_SUMMARY, ci/summary.py) показывает полную картину, отчёты build/ — в артефакте.
name: PLC static checks

on:
  workflow_call:
    inputs:
      python-version:
        description: Версия Python на раннере (инструментам шаблона нужен Python 3.11+)
        type: string
        default: "3.12"
      python-checks:
        description: ruff check, ruff format --check, mypy и pytest по настройкам pyproject.toml репозитория
        type: boolean
        default: true
      requirements:
        description: Файл зависимостей для Python-проверок (от working-directory)
        type: string
        default: requirements-dev.txt
      paths:
        description: Каталоги раскладки ST через пробел — исходники, затем тесты; st_lint проверяет все
        type: string
        default: src tests
      iec-checker:
        description: "Статанализ iec_checker: binary (v0.4 из релиза, SHA-256), docker (образ nightly по дайджесту) или off"
        type: string
        default: binary
      fail-on-iec-checker:
        description: Необоснованные находки iec_checker валят задание
        type: boolean
        default: true
      rusty:
        description: Проверка компилятором RuSTy (plc --check) совместимого подмножества
        type: boolean
        default: true
      fail-on-rusty:
        description: Ошибки RuSTy валят задание (по умолчанию проверка необязательная)
        type: boolean
        default: false
      working-directory:
        description: Корень ПЛК-репозитория внутри checkout (для монорепозитория)
        type: string
        default: "."
      artifact-name:
        description: Имя артефакта с отчётами build/ (уникальное, если workflow вызывается несколько раз)
        type: string
        default: plc-static-reports
      timeout-minutes:
        description: Таймаут задания, мин
        type: number
        default: 20
      toolkit-repository:
        description: owner/repo plc-ci-toolkit для скриптов сводки; пусто — репозиторий этого workflow
        type: string
        default: ""
      toolkit-ref:
        description: Коммит, тег или ветка plc-ci-toolkit; пусто — коммит этого workflow
        type: string
        default: ""
    outputs:
      result:
        description: Итог обязательных проверок — success или failure (пусто — сбой подготовки задания)
        value: ${{ jobs.static.outputs.result }}
      st-lint-errors:
        description: Число ошибок st_lint
        value: ${{ jobs.static.outputs.st-lint-errors }}
      iec-checker-errors:
        description: Число необоснованных находок iec_checker
        value: ${{ jobs.static.outputs.iec-checker-errors }}
      rusty-errors:
        description: Число ошибок RuSTy
        value: ${{ jobs.static.outputs.rusty-errors }}

env:
  # iec_checker v0.4 — та же версия, что локально (docs/STATIC_ANALYSIS.md): обоснования в
  # tools/check/iec_checker_allow.toml подобраны под её находки. У релиза 2022 года нет контрольной
  # суммы: размер — из API GitHub Releases, SHA-256 вычислен по скачанному файлу (как в CI шаблона).
  IEC_CHECKER_VERSION: v0.4
  IEC_CHECKER_SIZE: "10816408"
  IEC_CHECKER_SHA256: e7bea2a594ad47d089650944c9095251a7db5b44c953f726390ca0023675fa40
  # Образ nightly, закреплённый по дайджесту (Docker Hub, тег nightly от 2026-07-13)
  IEC_CHECKER_IMAGE: jubnzv1/iec-checker:nightly@sha256:fb1b148d4b6c5899f04924e87f78c6b5a3fc54ced31496b9ad50d0c8fbbdbe3d
  # RuSTy v1.0.6: SHA-256 файлов релиза (API GitHub Releases, поле digest)
  RUSTY_VERSION: v1.0.6
  RUSTY_PLC_SHA256: cee05d9871b7a4dea66ad0e1a3a94cce858d28967c0bdecd16a821e3c621a6bf
  RUSTY_STDLIB_SHA256: 17086c67d46cdba0a6acf8c3c8e3b594804053df3913dab2756ef555cb826129
  PYTHONUTF8: "1"

jobs:
  static:
    name: Python, сборка ST, st_lint, iec_checker, RuSTy
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      PATHS: ${{ inputs.paths }}
      IEC_MODE: ${{ inputs.iec-checker }}
    outputs:
      result: ${{ steps.summary.outputs.result }}
      st-lint-errors: ${{ steps.summary.outputs.st-lint-errors }}
      iec-checker-errors: ${{ steps.summary.outputs.iec-checker-errors }}
      rusty-errors: ${{ steps.summary.outputs.rusty-errors }}
    steps:
      # --- подготовка: при сбое любого шага проверки ниже не запускаются (условие steps.validate) ---
      - name: Выгрузка репозитория
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Скрипты сводки (ci/) — из того же коммита plc-ci-toolkit, что и этот workflow:
      # job.workflow_repository и job.workflow_sha указывают на файл переиспользуемого workflow.
      - name: Выгрузка plc-ci-toolkit (скрипты сводки)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.toolkit-repository || job.workflow_repository }}
          ref: ${{ inputs.toolkit-ref || job.workflow_sha }}
          path: .plc-ci-toolkit
          persist-credentials: false

      # Кэш pip — только если файл зависимостей есть: иначе setup-python завершился бы ошибкой «No file
      # matched» до проверок, без сводки; без файла понятную ошибку даёт шаг «Python-зависимости»
      - name: Python ${{ inputs.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: >-
            ${{ inputs.python-checks
            && hashFiles(format('{0}/{1}', inputs.working-directory, inputs.requirements)) != ''
            && 'pip' || '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.requirements }}

      - name: Проверка входов
        id: validate
        working-directory: .
        run: |
          set -euo pipefail
          if [ ! -f .plc-ci-toolkit/ci/summary.py ]; then
            echo "::error title=plc-static::в выгрузке plc-ci-toolkit нет ci/summary.py: задайте toolkit-repository и toolkit-ref"
            exit 1
          fi
          # служебный каталог не попадает в git status
          if [ -d .git/info ]; then echo "/.plc-ci-toolkit/" >> .git/info/exclude; fi
          case "$IEC_MODE" in
            binary | docker | off) ;;
            *)
              echo "::error title=plc-static::iec-checker: ожидалось binary, docker или off, получено '$IEC_MODE'"
              exit 1
              ;;
          esac
          read -r -a dirs <<< "$PATHS"
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::error title=plc-static::paths: не задан ни один каталог раскладки"
            exit 1
          fi

      - name: Python-зависимости
        id: deps
        if: ${{ inputs.python-checks && steps.validate.outcome == 'success' }}
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
        run: |
          set -euo pipefail
          if [ ! -f "$REQUIREMENTS" ]; then
            echo "::error title=plc-static::нет файла $REQUIREMENTS: задайте requirements или python-checks: false"
            exit 1
          fi
          python -m pip install --disable-pip-version-check -r "$REQUIREMENTS"

      # До pytest: с переменной IEC_CHECKER интеграционные тесты шаблона идут с настоящим разборщиком,
      # в том числе проверка, что каждое обоснование tools/check/iec_checker_allow.toml используется.
      - name: Загрузка iec_checker
        id: iec_tool
        if: ${{ !cancelled() && steps.validate.outcome == 'success' && inputs.iec-checker != 'off' }}
        continue-on-error: ${{ !inputs.fail-on-iec-checker }}
        run: |
          set -euo pipefail
          if [ "$IEC_MODE" = docker ]; then
            docker pull "$IEC_CHECKER_IMAGE"
            exit 0
          fi
          dir="$RUNNER_TEMP/iec-checker"
          url="https://github.com/iec-checker/iec-checker/releases/download/$IEC_CHECKER_VERSION/iec_checker_Linux_x86_64"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/iec_checker" "$url"
          size=$(stat -c %s "$dir/iec_checker")
          if [ "$size" != "$IEC_CHECKER_SIZE" ]; then
            echo "::error title=plc-static::iec_checker: размер файла $size, ожидался $IEC_CHECKER_SIZE"
            exit 1
          fi
          echo "$IEC_CHECKER_SHA256  $dir/iec_checker" | sha256sum -c -
          chmod +x "$dir/iec_checker"
          echo "IEC_CHECKER=$dir/iec_checker" >> "$GITHUB_ENV"

      # --- проверки: выполняются все, даже если одна упала ---
      - name: ruff check
        id: ruff
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m ruff check --extend-exclude .plc-ci-toolkit .

      - name: ruff format --check
        id: ruff_format
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m ruff format --check --extend-exclude .plc-ci-toolkit .

      - name: mypy
        id: mypy
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m mypy

      - name: pytest
        id: pytest
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m pytest --junit-xml=build/pytest.xml

      - name: Сборка ST (assemble)
        id: assemble
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: |
          set -euo pipefail
          read -r -a dirs <<< "$PATHS"
          args=(--src "${dirs[0]}")
          if [ "${#dirs[@]}" -gt 1 ]; then args+=(--tests --tests-dir "${dirs[1]}"); fi
          python tools/assemble.py "${args[@]}"

      # Текстовый вывод — в журнал, JSON (build/st_lint.json) — для сводки и аннотаций
      - name: Линтер ST (st_lint --strict)
        id: st_lint
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: |
          set -uo pipefail
          read -r -a dirs <<< "$PATHS"
          mkdir -p build
          status=0
          python tools/check/st_lint.py --strict "${dirs[@]}" || status=$?
          python tools/check/st_lint.py --strict --json "${dirs[@]}" > build/st_lint.json || true
          exit "$status"

      # run_iec_checker.py сам собирает вариант iec-checker в build/assembled/iec-checker/;
      # отчёты — build/iec_checker.json и build/iec_checker.md
      - name: Статанализ (iec_checker)
        id: iec_checker
        if: ${{ !cancelled() && steps.iec_tool.outcome == 'success' }}
        continue-on-error: ${{ !inputs.fail-on-iec-checker }}
        run: |
          set -euo pipefail
          read -r -a dirs <<< "$PATHS"
          args=(--src "${dirs[0]}")
          if [ "${#dirs[@]}" -gt 1 ]; then args+=(--tests --tests-dir "${dirs[1]}"); fi
          if [ "$IEC_MODE" = docker ]; then
            args+=(--docker "$IEC_CHECKER_IMAGE")
          else
            args+=(--binary "$IEC_CHECKER")
          fi
          python tools/check/run_iec_checker.py "${args[@]}"

      # После pytest: RuSTy — необязательная проверка, её интеграционные тесты не должны влиять на pytest
      - name: Загрузка RuSTy
        id: rusty_tool
        if: ${{ !cancelled() && steps.validate.outcome == 'success' && inputs.rusty }}
        continue-on-error: ${{ !inputs.fail-on-rusty }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/rusty"
          base="https://github.com/PLC-lang/rusty/releases/download/$RUSTY_VERSION"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/plc" "$base/plc-linux-x86_64"
          curl -fsSL --retry 3 -o "$dir/stdlib.tar.gz" "$base/stdlib-${RUSTY_VERSION#v}.tar.gz"
          echo "$RUSTY_PLC_SHA256  $dir/plc" | sha256sum -c -
          echo "$RUSTY_STDLIB_SHA256  $dir/stdlib.tar.gz" | sha256sum -c -
          chmod +x "$dir/plc"
          tar -xzf "$dir/stdlib.tar.gz" -C "$dir"
          "$dir/plc" --version
          echo "RUSTY_PLC=$dir/plc" >> "$GITHUB_ENV"
          echo "RUSTY_STDLIB_INCLUDE=$dir/stdlib/include" >> "$GITHUB_ENV"

      # Несовместимые с RuSTy файлы — в tools/check/rusty_exclude.txt (с причиной)
      - name: RuSTy plc --check
        id: rusty
        if: ${{ !cancelled() && steps.rusty_tool.outcome == 'success' }}
        continue-on-error: ${{ !inputs.fail-on-rusty }}
        run: |
          set -euo pipefail
          read -r -a dirs <<< "$PATHS"
          args=(--src "${dirs[0]}")
          if [ "${#dirs[@]}" -gt 1 ]; then args+=(--tests-dir "${dirs[1]}"); else args+=(--no-tests); fi
          python tools/check/run_rusty.py "${args[@]}"

      # --- итог ---
      - name: Сводка
        id: summary
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        env:
          PLC_CI_STEPS: ${{ toJSON(steps) }}
          WORKDIR: ${{ inputs.working-directory }}
          ARTIFACT: ${{ inputs.artifact-name }}
          PY_CHECKS: ${{ inputs.python-checks }}
          IEC_BLOCKING: ${{ inputs.fail-on-iec-checker }}
          RUSTY: ${{ inputs.rusty }}
          RUSTY_BLOCKING: ${{ inputs.fail-on-rusty }}
        run: |
          set -euo pipefail
          if [ "$IEC_MODE" = docker ]; then label="iec_checker nightly (Docker)"; else label="iec_checker $IEC_CHECKER_VERSION"; fi
          python "$GITHUB_WORKSPACE/.plc-ci-toolkit/ci/summary.py" static \
            --root . --path-prefix "$WORKDIR" --annotations --artifact "$ARTIFACT" --paths "$PATHS" \
            --python-checks "$PY_CHECKS" --iec-checker "$IEC_MODE" --iec-blocking "$IEC_BLOCKING" \
            --iec-label "$label" --rusty "$RUSTY" --rusty-blocking "$RUSTY_BLOCKING"

      - name: Артефакты (build/)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/build/
          if-no-files-found: warn
          retention-days: 14
