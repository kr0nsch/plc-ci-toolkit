# CI plc-ci-toolkit — проверки, которым не нужен CODESYS:
# - actionlint: workflow в .github/workflows и пример подключения examples/consumer-ci.yml (входы
#   примера сверяются с plc-static.yml и plc-codesys.yml);
# - тесты скриптов ci/ на Linux и Windows, на минимальной (3.11) и новой версии Python;
# - самопроверка переиспользуемого plc-static.yml на собственном примере ST (src/, tests/ из шаблона)
#   локальным вызовом — так же, как его вызывает репозиторий-потребитель; отдельно — с образом
#   iec_checker nightly (необязательно).
# Сборка и тесты в CODESYS — workflow codesys.yml на self-hosted раннере.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # actionlint v1.7.12 (2026-03-30): SHA-256 архива linux_amd64 — из файла
  # actionlint_1.7.12_checksums.txt релиза и поля digest API GitHub Releases (совпадают)
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Загрузка actionlint ${{ env.ACTIONLINT_VERSION }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/actionlint"
          base="https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/actionlint.tar.gz" "$base/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $dir/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$dir/actionlint.tar.gz" -C "$dir" actionlint
          echo "$dir" >> "$GITHUB_PATH"

      # Настройки — .github/actionlint.yaml; shellcheck на раннере Ubuntu есть, actionlint проверяет им run-скрипты
      - name: actionlint — .github/workflows
        run: actionlint -color

      # Пример подключения: ссылки <владелец>/plc-ci-toolkit/.github/workflows/...@v1 заменяются
      # локальными, чтобы actionlint сверил входы примера с этими workflow (временный файл, в git не попадает)
      - name: actionlint — examples/consumer-ci.yml
        run: |
          set -euo pipefail
          sed -e 's#[^ /]*/plc-ci-toolkit/\(\.github/workflows/[a-z-]*\.yml\)@v1#./\1#' \
            examples/consumer-ci.yml > .github/workflows/zz-consumer-example.yml
          if grep -n 'plc-ci-toolkit/\.github' .github/workflows/zz-consumer-example.yml; then
            echo "::error::в примере осталась ссылка, которую не удалось заменить локальной"
            exit 1
          fi
          actionlint -color .github/workflows/zz-consumer-example.yml

  tests:
    name: Скрипты ci/ (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            lint: true
          - os: ubuntu-latest
            python: "3.13"
          # ci/summary.py и ci/runner_check.py выполняются и на self-hosted Windows (plc-codesys.yml)
          - os: windows-latest
            python: "3.11"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Зависимости
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: ruff check ci/
        if: ${{ matrix.lint }}
        run: python -m ruff check ci

      - name: ruff format --check ci/
        if: ${{ matrix.lint }}
        run: python -m ruff format --check ci

      - name: mypy
        if: ${{ matrix.lint }}
        run: python -m mypy

      - name: pytest ci/tests
        run: python -m pytest ci/tests

  # Самопроверка: тот же вызов, что в examples/consumer-ci.yml, но локальный (./.github/workflows/...):
  # скрипты сводки берутся из этого же коммита (job.workflow_repository, job.workflow_sha)
  static:
    name: plc-static (пример ST)
    uses: ./.github/workflows/plc-static.yml
    with:
      iec-checker: binary
      rusty: true

  # Новая версия разборщика может найти больше или иначе: расхождения с v0.4 переносятся в
  # docs/STATIC_ANALYSIS.md, падение не блокирует (fail-on-iec-checker: false)
  static-nightly:
    name: plc-static (iec_checker nightly, необязательно)
    uses: ./.github/workflows/plc-static.yml
    with:
      python-checks: false
      iec-checker: docker
      fail-on-iec-checker: false
      rusty: false
      artifact-name: plc-static-nightly-reports
